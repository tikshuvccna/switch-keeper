<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2b2540">
  <link rel="icon" href="data:,">
  <title>שומר המתג</title>
</head>
<body>
  <div id="game"></div>
  <div id="screen" class="hide"></div>
  <div id="lessonsheet" class="hide"></div>
  <div id="hud">
    <div id="hearts"></div>
    <div id="meterWrap"><div id="meter"><i></i></div><span>קסם</span></div>
    <div id="xpWrap"><span id="lvl">רמה 1</span><div id="xp"><i></i></div></div>
    <div id="bits"></div>
  </div>
  <div id="combo"></div>
  <div id="toast"></div>
  <div id="pad"><div id="stick"><div id="knob"></div></div></div>
  <div id="btns">
    <button id="bJump" type="button" data-k="jump">קפיצה</button>
    <button id="bAtk" type="button" data-k="attack">מכה</button>
    <button id="bExtra" type="button" data-k="extra" data-mode="" class="hide"></button>
    <button id="bShoot" type="button" data-k="shoot">ירי</button>
    <button id="bDash" type="button" data-k="dash">דאש</button>
    <button id="bMagic" type="button" data-k="magic">קסם</button>
  </div>
  <div id="gate" class="hide">
    <h1>שער נעול</h1>
    <p id="gateText"></p>
    <p id="gateStats"></p>
    <button id="gateOk" type="button">חזרה</button>
  </div>
  <div id="help">חיצים/WASD: תנועה · רווח: קפיצה (פעמיים באוויר; שוב על כדור ורוד = פארי) · עכבר שמאלי או J: מכה · עכבר ימני או K: ירי · Shift: דאש · L או גלגלת: סופר</div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
